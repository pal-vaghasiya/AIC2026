apiVersion: v1
kind: ConfigMap
metadata:
  name: controlplane-config
  namespace: controlplane
data:
  CP_SERVER__HOST: "0.0.0.0"
  CP_SERVER__PORT: "8080"
  CP_SERVER__MAX_CONCURRENT_STREAMS: "10000"
  CP_ML_ENGINE__ONNX_MODEL_PATH: "/etc/controlplane/models/deberta_injection.onnx"
  CP_ML_ENGINE__SLM_GGUF_PATH: "/etc/controlplane/models/llama_validator.gguf"
  CP_ML_ENGINE__PREFLIGHT_THRESHOLD: "0.85"
  CP_ML_ENGINE__THREAD_POOL_SIZE: "8"
  CP_CLICKHOUSE__URL: "http://clickhouse-service.controlplane.svc.cluster.local:8123"
  CP_CLICKHOUSE__TABLE: "audit_logs"

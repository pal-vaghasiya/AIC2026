apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane-gateway
  namespace: controlplane
  labels:
    app.kubernetes.io/name: controlplane-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: controlplane-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controlplane-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: controlplane/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: controlplane-config
          resources:
            requests:
              cpu: "4000m"
              memory: "8Gi"
            limits:
              cpu: "8000m"
              memory: "16Gi"
              nvidia.com/gpu: "1" # Optional CUDA passthrough for ONNX/GGUF acceleration
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
